<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星圖戰役模擬器</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1d2330;--mut:#6b7280;--line:#dde1e7;--acc:#2f6fd6;--good:#1f9d55;--bad:#d64545;--warn:#c98a00;--chip:#eef1f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--card:#1b2029;--fg:#e4e8ef;--mut:#8b93a3;--line:#2b323e;--acc:#5b9bf0;--good:#3ccf7d;--bad:#f06a6a;--warn:#e6b23c;--chip:#252c38}}
:root[data-theme="dark"]{--bg:#12151b;--card:#1b2029;--fg:#e4e8ef;--mut:#8b93a3;--line:#2b323e;--acc:#5b9bf0;--good:#3ccf7d;--bad:#f06a6a;--warn:#e6b23c;--chip:#252c38}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 system-ui,"Microsoft JhengHei","PingFang TC",sans-serif}
header{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
header h1{font-size:16px;margin:0 8px 0 0}
label{color:var(--mut);display:inline-flex;gap:4px;align-items:center}
input,select,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
input[type=number]{width:58px}
button{cursor:pointer;background:var(--chip)}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
main{display:grid;grid-template-columns:330px 1fr 360px;gap:12px;padding:12px 16px;align-items:start}
@media (max-width:1200px){main{grid-template-columns:1fr 1fr}#colLog{grid-column:1/-1}}
@media (max-width:760px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;overflow-x:auto}
.card h2{font-size:14px;margin:0 0 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.kv dt{color:var(--mut)}.kv dd{margin:0}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--acc)}
.acts{display:flex;flex-direction:column;gap:6px}
.act{text-align:left;padding:6px 8px}
.act b{display:block}.act small{color:var(--mut)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:3px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.log{max-height:78vh;overflow:auto}
.turn{border-bottom:1px solid var(--line);padding:6px 0}
.turn h3{font-size:12px;margin:0 0 2px}
.turn p{margin:1px 0;color:var(--mut)}
.turn p.ev{color:var(--fg)}.turn p.star{color:var(--warn);font-weight:600}.turn p.bad{color:var(--bad)}
.delta{font-size:11px}
.up{color:var(--good)}.dn{color:var(--bad)}
.req{background:var(--chip);border-radius:6px;padding:6px 8px;margin-top:8px}
.req .ok{color:var(--good)}.req .no{color:var(--bad)}
.tag{display:inline-block;background:var(--chip);border-radius:4px;padding:0 5px;margin:1px 2px 1px 0;font-size:11px}
.bld button{padding:1px 5px;font-size:11px}
details summary{cursor:pointer;color:var(--acc)}
.rules{color:var(--mut);font-size:12px}
.rules li{margin:2px 0}
.cmp td.n{font-variant-numeric:tabular-nums}
svg text{fill:var(--mut);font-size:8px}
</style>
</head>
<body>
<header>
  <h1>星圖戰役模擬器</h1>
  <label>開局身分 <select id="optId">
    <option value="cap">聯盟艦長（第一週目）</option>
    <option value="cmd">聯盟艦隊指揮官</option>
    <option value="gov">聯盟行星司令</option>
    <option value="head">聯盟元首</option>
  </select></label>
  <label>難度 <select id="optDiff"></select></label>
  <label title="AI 艦隊建造效率">AI強度<input id="dStr" type="number" step="0.05"></label>
  <label title="每週發動攻擊的機率">攻擊慾望<input id="dAggr" type="number" step="0.05"></label>
  <label title="敵對 AI 的收入倍率">資源產出<input id="dInc" type="number" step="0.05"></label>
  <label title="AI 選最佳目標的機率，其餘隨機">決策品質<input id="dSmart" type="number" step="0.05"></label>
  <label title="某勢力佔領比例超過此值，其他勢力優先攻擊它；0 = 關閉">聯手壓制<input id="dGang" type="number" step="0.05"></label>
  <label title="玩家艦隊在戰鬥中的損失倍率">玩家損失<input id="dLoss" type="number" step="0.05"></label>
  <label title="升遷所需戰功的倍率（不影響難度，只影響節奏）">升遷節奏<input id="optPace" type="number" step="0.1" value="1"></label>
  <label title="代表玩家實際打仗的手感：玩家艦隊的有效戰力倍率">操作水準<input id="optSkill" type="number" step="0.1" value="1"></label>
  <label>種子<input id="optSeed" type="number" value="1" style="width:80px"></label>
  <button class="pri" id="btnNew">新局</button>
</header>
<main>
  <div id="colL">
    <div class="card" id="cardPl"></div>
    <div class="card"><h2>本週行動</h2>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
        <button id="btnCmp">比較所有選項</button>
        <button id="btnUndo">上一週</button>
        <label><input type="checkbox" id="optDecline"> 拒絕升遷</label>
      </div>
      <div class="acts" id="acts"></div>
    </div>
    <div class="card"><h2>自動推進</h2>
      <label>策略 <select id="optStrat"></select></label>
      <div style="display:flex;gap:6px;margin-top:6px">
        <button data-auto="1">1 週</button><button data-auto="10">10 週</button><button data-auto="50">50 週</button>
      </div>
    </div>
  </div>
  <div id="colM">
    <div class="card" id="cardCmp" hidden></div>
    <div class="card"><h2>勢力</h2><div id="facTbl"></div><svg id="chart" viewBox="0 0 300 90" style="width:100%;margin-top:8px"></svg></div>
    <div class="card"><h2>星系</h2><div id="sysTbl"></div></div>
    <div class="card"><h2>節奏模擬（多局統計）</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <label>策略 <select id="pStrat"></select></label>
        <label>局數<input id="pRuns" type="number" value="20"></label>
        <label>每局週數<input id="pTurns" type="number" value="300"></label>
        <button id="btnPace">執行</button>
      </div>
      <p class="rules">用目前的難度和節奏設定，從聯盟艦長開局，自動玩很多局，統計每個官階和里程碑平均第幾週達成。</p>
      <div id="paceOut"></div>
    </div>
    <div class="card"><details><summary>規則摘要（目前的數值公式）</summary><ul class="rules" id="rules"></ul></details></div>
  </div>
  <div id="colLog"><div class="card"><h2>紀錄（最新在上）</h2><div class="log" id="log"></div></div></div>
</main>
<script>
'use strict';
/* ───────── 常數 ───────── */
const A = 0, E = 1, P = 2, X = 3, N = 4;
const FN = ['聯盟', '帝國', '海盜', '玩家', '中立'];
const FC = ['#4a8fe0', '#e05a4a', '#c9a227', '#3fbf7f', '#8a8f98'];
const MIL = ['艦長', '分隊長', '艦隊指揮官', '方面軍司令', '元帥'];
const MIL_MERIT = [0, 60, 180, 400, 800];
const MIL_CAP = [12, 45, 160, 220, 300];
const MIL_SAL = [4, 8, 15, 25, 40];
const MIL_CREW = [2, 4, 8, 10, 12];
const MIL_TF = [0.3, 0.3, 0.25, 0.4, 0.5];          // 執行命令時聯盟撥給的兵力比例
const GOV = ['行星司令', '星區總督', '議員', '元首'];
const GOV_REQ = [null, { perf: 55, sup: 45 }, { perf: 62, sup: 60 }, { perf: 68, sup: 75 }];
const GOV_SAL = [12, 22, 35, 0];
const GOV_CREW = [3, 5, 7, 15];
const SUP = ['鷹派', '鴿派', '財團'];
const TIER = ['荒地', '聚落', '城鎮', '都市', '巨型都市'];
const TIER_CAP = [2, 4, 8, 14, 22];
const TIER_MODELS = [0, 6, 18, 40, 80];
const MEGA = { dock: { n: '大型船塢', c: 120 }, elev: { n: '軌道電梯', c: 100 }, radar: { n: '深空雷達', c: 80 }, gate: { n: '跳躍門', c: 150 }, shield: { n: '行星護盾', c: 130 } };
const DIFF = {
  easy:   { n: '簡單', str: 0.8, aggr: 0.25, inc: 0.85, smart: 0.5, gang: 0, loss: 0.8 },
  normal: { n: '普通', str: 1.0, aggr: 0.35, inc: 1.0, smart: 0.7, gang: 0.5, loss: 1.0 },
  hard:   { n: '困難', str: 1.2, aggr: 0.45, inc: 1.15, smart: 0.85, gang: 0.45, loss: 1.15 },
  brutal: { n: '殘酷', str: 1.4, aggr: 0.6, inc: 1.3, smart: 1.0, gang: 0.4, loss: 1.3 },
};
const NAMES = ['阿爾泰', '貝倫', '卡斯托', '德米亞', '埃里多', '法洛斯', '蓋亞斯', '赫利恩', '伊歐拉', '賈納斯', '凱倫', '莉薇拉', '摩頓', '諾瓦', '奧利昂', '佩拉', '奎林', '瑞亞', '賽洛斯', '塔倫', '烏爾', '薇恩', '韋斯塔', '澤菲爾', '亞特', '布蘭', '席恩', '多拉'];
const NPC = ['巴爾克', '霍斯特', '佩蕾', '格倫', '奧德', '薇拉', '卡蘭', '索恩', '伊格', '莫蘭', '黛菈', '雷文', '芙蕾', '戈爾', '尤里', '艾德', '娜塔', '羅森'];
const NPC_EXIT = ['調任後方', '光榮退役', '戰死沙場', '因醜聞去職', '升任他職', '病倒退休'];

/* ───────── 亂數（狀態存在 S 裡，複製狀態＝可重現） ───────── */
function rnd(S) { let t = (S.r = (S.r + 0x6D2B79F5) >>> 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const pick = (S, a) => a[Math.floor(rnd(S) * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r1 = (v) => Math.round(v * 10) / 10;

/* ───────── 地圖 ───────── */
function adj(S, i) { const o = []; for (const e of S.edges) { if (e[0] === i) o.push(e[1]); else if (e[1] === i) o.push(e[0]); } return o; }
function genMap(S) {
  const pts = []; let minD = 12, tries = 0;
  while (pts.length < 24) { tries++; if (tries % 3000 === 0) minD -= 1; const x = 4 + rnd(S) * 92, y = 4 + rnd(S) * 52; if (pts.every((p) => Math.hypot(p.x - x, p.y - y) > minD)) pts.push({ x, y }); }
  pts.sort((a, b) => a.x - b.x);
  const has = (a, b) => S.edges.some((e) => (e[0] === a && e[1] === b) || (e[0] === b && e[1] === a));
  S.edges = [];
  pts.forEach((p, i) => { pts.map((q, j) => ({ j, d: Math.hypot(p.x - q.x, p.y - q.y) })).filter((o) => o.j !== i).sort((a, b) => a.d - b.d).slice(0, 2).forEach((o) => { if (!has(i, o.j)) S.edges.push([i, o.j]); }); });
  // 保證連通
  for (;;) {
    const seen = new Set([0]), st = [0];
    while (st.length) { const i = st.pop(); for (const j of adjRaw(S.edges, i)) if (!seen.has(j)) { seen.add(j); st.push(j); } }
    if (seen.size === pts.length) break;
    let best = null;
    for (const i of seen) for (let j = 0; j < pts.length; j++) if (!seen.has(j)) { const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y); if (!best || d < best.d) best = { i, j, d }; }
    S.edges.push([best.i, best.j]);
  }
  const mid = [8, 9, 10, 11, 12, 13, 14, 15];
  for (let i = mid.length - 1; i > 0; i--) { const j = Math.floor(rnd(S) * (i + 1)); [mid[i], mid[j]] = [mid[j], mid[i]]; }
  const names = NAMES.slice();
  S.sys = pts.map((p, i) => {
    const owner = i < 8 ? A : i >= 16 ? E : mid.indexOf(i) < 4 ? P : N;
    const cap = i === 0 || i === 23;
    const tier = cap ? 3 : owner === N ? 1 : owner === P ? 1 : 1 + (rnd(S) < 0.4 ? 1 : 0);
    const nm = names.splice(Math.floor(rnd(S) * names.length), 1)[0];
    const wx = { k: ['solar', 'ion', 'grav'][Math.floor(rnd(S) * 3)], per: 6 + Math.floor(rnd(S) * 7), len: 2, ph: Math.floor(rnd(S) * 12) };   // 每個星系一種週期性天氣：每 per 週出現 len 週
    return { id: i, name: nm, x: p.x, y: p.y, owner, cap, tier, pop: cap ? 12 : r1(TIER_CAP[tier] * (0.5 + rnd(S) * 0.4)), prosp: cap ? 70 : 35 + Math.round(rnd(S) * 20), def: cap ? 6 : owner === N ? 1 : 2 + Math.floor(rnd(S) * 3), gar: cap ? 45 : 20, mega: cap ? { dock: 1, shield: 1 } : {}, hit: -99, sg: null, dis: -1, wx };
  });
}
function adjRaw(edges, i) { const o = []; for (const e of edges) { if (e[0] === i) o.push(e[1]); else if (e[1] === i) o.push(e[0]); } return o; }

/* ───────── 新局 ───────── */
function newGame(o) {
  const S = { r: (o.seed >>> 0) || 1, turn: 1, ww: [0, 0, 0, 0, 0], diff: { ...o.diff }, pace: o.pace, log: [], cur: [], hist: [], ms: [], unlock: [], firsts: {}, policy: { aggr: 0.35 }, rules: { ...RULES0, ...(o.rules || {}) },
    st: { cap: 0, capSiege: 0, capAssault: 0, space: 0, relief: 0, raid: 0, raidOk: 0, plCap: 0, plSiege: 0, sgSup: 0, why: { pl: [0, 0], ai: [0, 0] }, rc: {} } };
  genMap(S);
  S.fac = [0, 1, 2, 3, 4].map((f) => ({ money: 60, field: f === A || f === E ? 300 : f === P ? 100 : 0, aggr: f === P ? 0.5 : 0.35 }));
  S.rel = [0, 1, 2, 3, 4].map(() => [0, 0, 0, 0, 0]);
  setRel(S, A, E, -60); setRel(S, A, P, -100); setRel(S, E, P, -100); setRel(S, X, P, -40);
  const pl = S.pl = { aff: A, mil: 0, gov: -1, merit: 0, trust: 50, sup: [30, 30, 30], money: 30, crew: 20, fleet: 12, gs: [], backer: -1, examPassed: false, order: null, miss: null, guard: -1, raid: 0, peace: 0, status: '正常', decline: false, skill: o.skill, acted: '', expand: 0, merc: 0, garT: 20 };
  if (o.id === 'cmd') { pl.mil = 2; pl.merit = 180; pl.fleet = 160; }
  if (o.id === 'gov') { pl.gov = 0; pl.gs = [govPick(S)]; pl.fleet = 45; pl.money = 60; }
  if (o.id === 'head') { pl.gov = 3; pl.mil = 0; pl.gs = owned(S, A).map((s) => s.id); pl.fleet = 145; pl.sup = [40, 40, 40]; }
  genOrders(S);
  S.hist.push(counts(S));
  return S;
}
function setRel(S, a, b, v) { S.rel[a][b] = S.rel[b][a] = clamp(v, -100, 100); }

/* ───────── 查詢 ───────── */
const owned = (S, f) => S.sys.filter((s) => s.owner === f);
const counts = (S) => [A, E, P, X, N].map((f) => owned(S, f).length);
function atWar(S, a, b) { if (a === b || a === N || b === N) return false; return S.rel[a][b] < 0; }
function hostile(S, f) { return S.pl.aff === X ? f !== X : f !== A && f !== X; }
const frontier = (S, s) => adj(S, s.id).some((j) => S.sys[j].owner !== s.owner);
const sysIncome = (s) => s.pop * (0.4 + s.prosp / 100) * 0.6 * (s.mega.elev ? 1.15 : 1) * (s.unrest > 0 ? 0.3 : 1) * (s.sg ? 0 : 1);   // 被圍城：沒有收入
const facIncome = (S, f) => owned(S, f).reduce((a, s) => a + sysIncome(s), 0);
/* ───────── 佔領流程（S.rules.flow）：太空戰奪軌道 → 下一回合起「強攻」或「圍城 siegeT 回合投降」；突襲癱瘓地面防禦 raidT 回合 ───────── */
const RULES0 = { flow: true, siegeT: 3, raidT: 5, raid: true, wx: 'all', support: true, stealth: false };   // wx：天氣（all／none／solar／ion／grav）；support：圍城方增援與護航；stealth：玩家有匿蹤躍遷科技
const WX = { solar: '太陽風暴', ion: '離子星雲', grav: '重力潮汐' };
const RAID_INF = { siege: 1, noFleet: 0.9, storm: 0.7, stealth: 0.6 };   // 突襲的條件 → 成功潛入的機率（被發現＝任務取消、特種部隊受損）
// 太空：所屬勢力的野戰艦隊 30%（雷達 ×1.3）＋玩家在這裡的艦隊
function spacePow(S, s) {
  let d = 0;
  if (s.owner < X) d += S.fac[s.owner].field * 0.3 * (s.mega.radar && !storm(S, s) ? 1.3 : 1);
  if (s.owner === X) d += S.pl.fleet * S.pl.skill * 0.6;
  if (S.pl.guard === s.id) d += S.pl.fleet * S.pl.skill;
  return d;
}
// 地面：守軍＋防衛建築×8（行星護盾 ×1.5）；突襲成功＝防衛建築與護盾停擺
function groundPow(S, s) { const off = s.dis > S.turn; return (s.gar + (off ? 0 : s.def * 8 * (ionOn(S, s) ? 0.7 : 1))) * (s.mega.shield && !off ? 1.5 : 1); }
// 天氣：每個星系自帶週期性的太陽風暴（雷達失效，可以突襲）
const wxOn = (S, s, k) => s.wx && s.wx.k === k && (S.rules.wx === 'all' || S.rules.wx === k) && (S.turn + s.wx.ph) % s.wx.per < s.wx.len;
const storm = (S, s) => wxOn(S, s, 'solar');                // 太陽風暴：雷達失效、情報中斷，特種部隊可以避開艦隊突襲
const ionOn = (S, s) => wxOn(S, s, 'ion');                  // 離子星雲：光束武器射程縮短 → 地面砲台（光束）效能 ×0.7
const gravOn = (S, s) => wxOn(S, s, 'grav');                // 重力潮汐：可航行空間縮小 → 進場兵力上限 ×0.6
const hasFleet = (S, s) => spacePow(S, s) >= 30;
function defPow(S, s) {
  if (S.rules && S.rules.flow) return s.sg ? groundPow(S, s) : spacePow(S, s) + groundPow(S, s);   // 進攻方面對的：被圍的只剩地面
  let d = s.gar + s.def * 8; if (s.mega.shield) d *= 1.5;
  if (s.owner < X) d += S.fac[s.owner].field * 0.3 * (s.mega.radar ? 1.3 : 1);
  if (s.owner === X) d += S.pl.fleet * S.pl.skill * 0.6;
  if (S.pl.guard === s.id) d += S.pl.fleet * S.pl.skill;
  return d;
}
function plCap(S) {
  const p = S.pl;
  if (p.aff === X) { const my = owned(S, X); return Math.max(p.baseCap || 0, 60 + 15 * my.length + 40 * my.filter((s) => s.mega.dock).length) + 30 * (p.expand || 0); }
  if (p.gov >= 0) return 45 + 40 * p.gs.filter((i) => S.sys[i].mega.dock).length + (p.gov === 3 ? 100 : 0);
  return MIL_CAP[p.mil];
}
function rankLabel(S) {
  const p = S.pl;
  if (p.status === '終結') return '已終結';
  if (p.aff === X) return owned(S, X).length ? '獨立領主' : '流亡船長';
  return p.gov >= 0 ? `聯盟${GOV[p.gov]}` : `聯盟${MIL[p.mil]}`;
}
const govPerf = (S) => (S.pl.gs.length ? S.pl.gs.reduce((a, i) => a + S.sys[i].prosp, 0) / S.pl.gs.length : 0);

/* ───────── 行動清單 ───────── */

/* ───────── 執行行動 ───────── */
const winText = (r, tn) => (r.phase === 'space' ? `奪得 ${tn} 的軌道，開始圍城（下回合起可強攻，或等它投降）` : r.phase === 'assault' ? `強攻佔領 ${tn}` : r.phase === 'relief' ? `解除 ${tn} 的圍城` : `攻下 ${tn}`);

/* ───────── 回合結束 ───────── */
function endTurn(S) {
  const p = S.pl;
  const ord = [A, E, P].sort(() => rnd(S) - 0.5);
  for (const f of ord) aiTurn(S, f);
  if (S.rules.flow) siegeTick(S);
  // 協防結算
  if (p.acted === 'order' && p.order && p.order.kind === 'defend') {
    if (S.sys[p.order.t].owner === A) { p.merit += 8; p.trust += 4; L(S, `${S.sys[p.order.t].name} 守住了（戰功 +8，信任 +4）`); }
  }

  // 成長與繁榮
  for (const s of S.sys) {
    if (s.unrest > 0) s.unrest--;
    const cap = TIER_CAP[s.tier];
    s.pop = r1(Math.max(0.5, s.pop + Math.max(0.05, s.pop * 0.03 * (s.prosp / 100) * (1 - s.pop / cap))));
    if (s.pop > cap) s.pop = cap;
    const tgt = 25 + s.tier * 12 + Math.min(s.def, 6) * 2 + (s.mega.elev ? 8 : 0) + (s.cap ? 10 : 0) - (S.turn - s.hit < 3 ? 20 : 0);

      const add = Math.min(cap - p.fleet, cap * 0.15 * (p.rest ? 2 : 1), p.crew / 0.3);

    } else {

      const add = Math.min(cap - p.fleet, cap * 0.2 * (p.rest ? 2 : 1), Math.max(0, p.money), p.crew / 0.5);

  return `<div class="req">下一階：<b>${MIL[nx]}</b><br>${ok(p.merit >= req)} 戰功 ${Math.round(p.merit)} / ${req}${nx === 4 ? `<br>${ok(p.sup[0] >= 50)} 鷹派支持 ${Math.round(p.sup[0])} / 50` : ''}<br>→ 條件達成後，上級會指派<b>考核任務</b>，完成即晉升</div>`;
}
function milBox() {
  const p = S.pl, ec = expandCost(S);
  let h = '<div class="req"><b>軍備（不佔本週行動）</b><br>';
  h += `傭兵待命：${Math.round(p.merc || 0)}　${[50, 100, 200].map((n) => `<button data-x="merc:${n}" ${p.money < n * MERC_PRICE ? 'disabled' : ''}>雇 ${n}（${n * MERC_PRICE}）</button>`).join(' ')}<br><small>傭兵只參加下一場進攻，打完就離開</small>`;
  if (p.aff === X) {
    h += `<br><button data-x="expand" ${p.money < ec.money || p.crew < ec.crew ? 'disabled' : ''}>擴編 +30 上限（資金 ${ec.money}、人口 ${ec.crew}）</button> 已擴編 ${p.expand || 0} 次`;
    h += `<br><label>每個星系守軍目標 <input id="garT" type="number" step="10" min="0" value="${p.garT}"></label><br><small>守軍每週維持費 0.03／點（目前 ${r1(0.03 * owned(S, X).reduce((a, s) => a + s.gar, 0))}）</small>`;
  }
  return h + '</div>';
}
function render() {
  const p = S.pl, cap = plCap(S);
  $('cardPl').innerHTML = `<h2>第 ${S.turn} 週　${rankLabel(S)}</h2>
  <dl class="kv">
    <dt>戰功</dt><dd>${Math.round(p.merit)}</dd>
    <dt>${p.gov === 3 ? '民意' : '上級信任'}</dt><dd>${Math.round(p.trust)}${p.aff === A ? bar(p.trust, 100) : ''}</dd>
    ${p.aff === A ? SUP.map((n, i) => `<dt>${n}</dt><dd>${Math.round(p.sup[i])}${p.backer === i ? ' <span class="tag">靠山</span>' : ''}${bar(p.sup[i], 100)}</dd>`).join('') : ''}
    <dt>資金</dt><dd>${Math.round(p.money)}${p.gov === 3 ? `（國庫 ${Math.round(S.fac[A].money)}）` : ''}</dd>
    <dt>人口（船員）</dt><dd>${r1(p.crew)}</dd>
    <dt>直屬艦隊</dt><dd>${Math.round(p.fleet)} / ${cap}${bar(p.fleet, cap)}</dd>
    ${p.gs.length ? `<dt>轄區</dt><dd>${p.gs.map((i) => S.sys[i].name).join('、')}</dd>` : ''}
    ${S.ms.length ? `<dt>里程碑</dt><dd>${S.ms.map((m) => `<span class="tag">${m}</span>`).join('')}</dd>` : ''}
    ${S.unlock.length ? `<dt>週目解鎖</dt><dd>${S.unlock.map((m) => `<span class="tag">${m}</span>`).join('')}</dd>` : ''}
  </dl>${reqBox()}${p.status === '終結' ? '' : milBox()}`;
  const acts = actions(S);
  $('acts').innerHTML = acts.length ? acts.map((a) => `<button class="act" data-act="${a.id}" ${a.dis ? 'disabled' : ''}><b>${a.label}</b><small>${a.desc}</small></button>`).join('') : '<p class="rules">本局已終結。</p>';
  // 勢力
  const c = counts(S);
  $('facTbl').innerHTML = `<table><tr><th>勢力</th><th>星系</th><th>野戰艦隊</th><th title="野戰艦隊（玩家為直屬艦隊）＋所有星系守軍">總戰力</th><th>國庫</th><th>收入/週</th><th>與${p.aff === X ? '你' : '聯盟'}關係</th></tr>${[A, E, P, X, N].filter((f) => c[f] || f < X).map((f) => `<tr><td><span class="dot" style="background:${FC[f]}"></span>${FN[f]}</td><td>${c[f]}</td><td>${f === X ? Math.round(p.fleet) : f === N ? '-' : Math.round(S.fac[f].field)}</td><td>${f === N ? '-' : Math.round(totalPow(S, f))}</td><td>${f === X ? Math.round(p.money) : f === N ? '-' : Math.round(S.fac[f].money)}</td><td>${Math.round(facIncome(S, f))}</td><td>${f === N || f === p.aff ? '-' : S.rel[p.aff][f]}${atWar(S, p.aff, f) ? ' 交戰' : ''}</td></tr>`).join('')}</table>`;
  drawChart();
  // 星系
  const bud = budget(S);
  $('sysTbl').innerHTML = `<table><tr><th>星系</th><th>勢力</th><th>人口</th><th>都市</th><th>繁榮</th><th>防衛</th><th>守軍</th><th>防禦力</th><th>巨構</th><th title="第一版固定排佈：依都市等階×繁榮生成的建築模型數">模型數</th><th>建設</th></tr>${S.sys.map((s) => {
    const mine = canBuild(S, s), models = Math.round(TIER_MODELS[s.tier] * (0.4 + s.prosp / 100 * 0.8));
    let b = '';
    if (mine) {
      b = `<span class="bld"><button data-b="${s.id}:city" ${s.tier >= 4 || s.pop < TIER_CAP[s.tier] * 0.7 || bud < cityCost(s) ? 'disabled' : ''} title="需要人口達上限 70%">都市 ${cityCost(s)}</button> <button data-b="${s.id}:def" ${s.def >= 10 || bud < 25 ? 'disabled' : ''}>防衛 25</button> ${Object.keys(MEGA).filter((k) => !s.mega[k]).map((k) => `<button data-b="${s.id}:${k}" ${s.tier < 2 || bud < MEGA[k].c ? 'disabled' : ''} title="需要城鎮以上">${MEGA[k].n} ${MEGA[k].c}</button>`).join(' ')}</span>`;
    }
    return `<tr><td>${s.cap ? '◆' : ''}${s.name}${p.gs.includes(s.id) ? ' <span class="tag">轄</span>' : ''}</td><td><span class="dot" style="background:${FC[s.owner]}"></span>${FN[s.owner]}</td><td>${s.pop}/${TIER_CAP[s.tier]}</td><td>${TIER[s.tier]}</td><td>${s.prosp}</td><td>${s.def}</td><td>${Math.round(s.gar)}</td><td>${Math.round(defPow(S, s))}</td><td>${Object.keys(s.mega).map((k) => MEGA[k].n.slice(-2)).join(' ')}</td><td>城${models}／防${s.def}／巨${Object.keys(s.mega).length}</td><td style="text-align:left">${b}</td></tr>`;
  }).join('')}</table>`;
  // 紀錄
  $('log').innerHTML = S.log.map((e) => `<div class="turn"><h3>第 ${e.t} 週：${e.act}</h3>${e.lines.map((l) => `<p class="${l.c}">${l.t}</p>`).join('')}<p class="delta">${deltaHtml(e.d)}</p></div>`).join('');
  $('btnUndo').disabled = !undo.length;
}
function deltaHtml(d) { return d.map((x) => typeof x.d === 'string' ? `<b>${x.k}→${x.d}</b>` : `<span class="${x.d > 0 ? 'up' : 'dn'}">${x.k}${x.d > 0 ? '+' : ''}${x.d}</span>`).join('　') || '<span>無變化</span>'; }
function drawChart() {
  const h = S.hist.slice(-200), n = h.length, W = 300, H = 80;
  if (n < 2) { $('chart').innerHTML = ''; return; }
  const x = (i) => i / (n - 1) * (W - 20) + 16, y = (v) => H - v / 24 * (H - 6);
  let out = `<text x="0" y="8">24</text><text x="0" y="${H}">0</text>`;
  [A, E, P, X, N].forEach((f) => { if (h.some((r) => r[f])) out += `<polyline fill="none" stroke="${FC[f]}" stroke-width="1.5" points="${h.map((r, i) => `${x(i).toFixed(1)},${y(r[f]).toFixed(1)}`).join(' ')}"/>`; });
  out += `<text x="${W - 60}" y="${H + 9}">星系數／週</text>`;
  $('chart').innerHTML = out;
}
function compareAll() {
  syncLive();
  const acts = actions(S).filter((a) => !a.dis);
  const rows = acts.map((a) => { const C = clone(S); C.log = []; const e = doTurn(C, a.id); return `<tr><td>${a.label}</td><td style="text-align:left;white-space:normal">${deltaHtml(e.d)}</td><td style="text-align:left;white-space:normal;color:var(--mut)">${e.lines.slice(0, 3).map((l) => l.t).join('；')}</td></tr>`; });
  $('cardCmp').hidden = false;
  $('cardCmp').innerHTML = `<h2>第 ${S.turn} 週：各選項的結果（同一個亂數，結果就是實際會發生的）</h2><table class="cmp"><tr><th>選項</th><th>變化</th><th>事件</th></tr>${rows.join('')}</table>`;
}
function rulesList() {
  return [
    '<b>升遷（軍職）</b>：戰功達門檻（分隊長 60／艦隊指揮官 180／方面軍司令 400／元帥 800，乘以「升遷節奏」；元帥另需鷹派 50）→ 上級指派考核任務 → 打贏就一定晉升，事件會說明是哪位 NPC 讓出位置。',
    '<b>升遷（政務）</b>：任期滿 10 週（乘以升遷節奏）＋轄區平均繁榮＋任一派系支持達標，就一定觸發推舉（星區總督 55/45、議員 62/60、元首 68/75）。推舉你的派系決定聯盟路線：鷹派＝更好戰，鴿派＝對帝國示好，財團＝收入 +15%。',
    '<b>戰功</b>：打贏 = (10 + 30 × 你的兵力佔比) × (首都 2 倍)，執行命令再 +10。官階越高，你的兵力佔比越大，戰功越多。',
    '<b>信任</b>：執行命令 +5（考核 +8），放棄命令 -4，擅自行動 -2，劫掠 -3，轄區失守 -12。≤10 會降職，艦長被降到底會被開除並流亡。',
    '<b>戰鬥</b>：攻方 × 0.85–1.15 對比防方 × 0.85–1.15。防禦力 = 守軍 + 防衛建築 × 8（護盾 ×1.5）+ 所屬勢力野戰艦隊 30%（雷達 ×1.3）。攻下後繁榮 -25、防衛減半、巨構各 30% 機率倒塌（護盾降到 15%）。',
    '<b>經濟</b>：星系收入 = 人口 × (0.4 + 繁榮/100) × 0.6（軌道電梯 ×1.15）。人口上限由都市等階決定（2/4/8/14/22）。繁榮趨向 25 + 等階×12 + 防衛×2（最多 6）+ 電梯 8 + 首都 10，近 3 週被攻擊則 -20。',
    '<b>玩家資源</b>：資金＝薪俸 + 轄區收入 30%（自立時為 100%）；人口＝船員，艦隊補充每點消耗 0.3（自立 0.5，並花費資金）。',
    '<b>難度</b>：AI 強度、攻擊慾望、資源產出只作用於「與玩家敵對」的勢力。另外加了：決策品質（AI 挑最佳目標的機率）、聯手壓制（某勢力佔比超過門檻時，其他勢力優先打它）、玩家損失倍率。',
    '<b>軍備（自立）</b>：擴編＝資金 80×(次數+1)＋人口 20，艦隊上限 +30。傭兵＝每點 2 資金，只參加下一場進攻（聯盟時期也能雇）。守軍目標可自訂，每點每週維持費 0.03。艦隊超過上限（例如失去星系）會解編多出的部分。',
    '<b>防止滾雪球</b>：新佔領的星系動盪 8 週（收入 ×0.3）；星系超過 8 個，每多一個艦隊維持成本 +0.3%／週；星系少於 8 個的勢力造艦效率提高（每少一個 +7%）。',
    '<b>厭戰與停戰</b>：失去星系厭戰 +4，進攻失敗 +1.5，每週 -0.4。聯盟與帝國厭戰合計超過 30 時，每週 15% 機率自動停戰（關係設為 +25，之後每週 -1，約 25 週後重新開戰）。玩家是元首時不會自動停戰。',
    '<b>叛亂</b>：勢力超過 14 個星系時，每多一個星系，每週有 3% 機率讓一個繁榮低或動盪中的星系叛變成海盜。海盜被消滅後，每週 6% 機率在最貧困的星系捲土重來。',
    '<b>失敗</b>：只有自立後艦隊與星系都歸零才會終結。聯盟艦長的座艦被擊沉會獲救並重新配艦（信任與戰功受罰）。',
    '<b>里程碑</b>：聯盟統一、自立統一（90% 星系）、最大中立（與聯盟和帝國和平 20 週、收入第一）、傳奇劫掠者（劫掠 1500）。達成後可以繼續玩。',
  ].map((t) => `<li>${t}</li>`).join('');
}

/* ───────── 綁定 ───────── */
$('optDiff').innerHTML = Object.entries(DIFF).map(([k, d]) => `<option value="${k}" ${k === 'normal' ? 'selected' : ''}>${d.n}</option>`).join('');
const stratOpts = Object.entries(STRATS).map(([k, s]) => `<option value="${k}">${s.n}</option>`).join('');
$('optStrat').innerHTML = stratOpts; $('pStrat').innerHTML = stratOpts;
fillDiff('normal');
$('optDiff').onchange = () => { fillDiff($('optDiff').value); syncLive(); };
DKEYS.forEach(([id]) => { $(id).onchange = syncLive; });
['optPace', 'optSkill', 'optDecline'].forEach((id) => { $(id).onchange = () => { syncLive(); render(); }; });
$('btnNew').onclick = start;
$('rules').innerHTML = rulesList();
document.addEventListener('click', (ev) => {
  const a = ev.target.closest('[data-act]'), b = ev.target.closest('[data-b]'), au = ev.target.closest('[data-auto]'), xb = ev.target.closest('[data-x]');
  if (xb && !xb.disabled) { syncLive(); undo.push(JSON.stringify(S)); S.cur = S.cur || []; const [k, n] = xb.dataset.x.split(':'); if (k === 'expand') expand(S); else hireMerc(S, +n); render(); }
  if (a && !a.disabled) { syncLive(); undo.push(JSON.stringify(S)); if (undo.length > 60) undo.shift(); doTurn(S, a.dataset.act); $('cardCmp').hidden = true; render(); }
  if (b && !b.disabled) { syncLive(); undo.push(JSON.stringify(S)); const [sid, k] = b.dataset.b.split(':'); S.cur = S.cur || []; build(S, +sid, k); render(); }
  if (au) { syncLive(); undo.push(JSON.stringify(S)); const sk = $('optStrat').value; for (let i = 0; i < +au.dataset.auto && S.pl.status !== '終結'; i++) { const id = autoPick(S, sk); doTurn(S, id); } $('cardCmp').hidden = true; render(); }
});
document.addEventListener('change', (ev) => { if (ev.target.id === 'garT' && S) { S.pl.garT = Math.max(0, +ev.target.value || 0); render(); } });
$('btnUndo').onclick =() => { if (!undo.length) return; S = JSON.parse(undo.pop()); $('cardCmp').hidden = true; render(); };
$('btnCmp').onclick = compareAll;
$('btnPace').onclick = () => { $('paceOut').innerHTML = '計算中…'; setTimeout(() => { const t0 = performance.now(); $('paceOut').innerHTML = paceRun($('pStrat').value, +$('pRuns').value, +$('pTurns').value) + `<p class="rules">耗時 ${Math.round(performance.now() - t0)} ms</p>`; }, 20); };
start();
</script>
